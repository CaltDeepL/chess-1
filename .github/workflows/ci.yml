name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
   
    

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chess
          POSTGRES_PASSWORD: chess
          POSTGRES_DB: chess_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://chess:chess@localhost:5432/chess_db

    defaults:
      run:
        working-directory: chess

    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chess

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets
      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
        working-directory: chess

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          

      - name: Install
        run: npm ci
      - name: npm audit
        run: npm audit --audit-level=moderate

      - name: Type check
        run: npx tsc -b --force

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  container-smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chess

    steps:
      - uses: actions/checkout@v7

      # コンパイル成功だけでは builder/runtime の ABI 不一致を検出できない。
      # Compose の DB 起動、マイグレーション、HTTP 応答までを確認する。
      - name: Build and start containers
        run: docker compose up --build --wait

      - name: Verify health endpoint
        run: curl -fsS http://localhost:3000/health

      - name: Show application logs on failure
        if: failure()
        run: docker compose logs app

      - name: Stop containers
        if: always()
        run: docker compose down --volumes
