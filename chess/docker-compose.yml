services:
  db:
    image: postgres:16
    container_name: chess-postgres
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
      POSTGRES_DB: chess_db
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess_db"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - chess-net
    volumes:
      - chess-db-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: chess-server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://chess:chess@db:5432/chess_db
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      SWEEP_TOKEN: ${SWEEP_TOKEN:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173,http://localhost:5174,http://localhost:5175}
    ports:
      - "3000:3000"
    networks:
      - chess-net

networks:
  chess-net:

volumes:
  chess-db-data:
